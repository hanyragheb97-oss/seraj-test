<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سراجLED - الواجهة الرئيسية</title>
    
    <!-- إضافات تطبيق الموبايل والأيقونات (الجديدة) -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#070913">
    <link rel="icon" href="icon.png" type="image/png">
    <link rel="apple-touch-icon" href="icon.png">
    
    <!-- استدعاء ملفات السحابة (Firebase) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <style>
        :root {
            --neon-border: #a855f7;
            --neon-glow: rgba(168, 85, 247, 0.5); 
            --bg-dark-1: #070913;
            --bg-dark-2: #120f29;
            --card-bg: rgba(19, 17, 44, 0.88);
            --text-white: #ffffff;        
        }

        body { 
            font-family: 'Segoe UI', Tahoma, sans-serif; 
            background: linear-gradient(135deg, var(--bg-dark-1), var(--bg-dark-2)); 
            color: var(--text-white); 
            margin: 0; 
            padding: 0; 
            user-select: none; 
            height: 100dvh; 
            width: 100vw; 
            overflow-y: auto; 
            overflow-x: hidden; 
            overscroll-behavior: none; 
            -webkit-tap-highlight-color: transparent;
        }
        
        .header { 
            background: rgba(19, 17, 44, 0.95); 
            backdrop-filter: blur(14px); 
            padding: 10px 15px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            position: sticky; 
            top: 0; 
            z-index: 50; 
            border-bottom: 3px solid var(--neon-border); 
            box-shadow: 0 0 45px var(--neon-glow), 0 10px 25px rgba(0, 0, 0, 0.7);
        }
        
        .brand-container {
            display: flex;
            align-items: center;
            gap: 14px;
            font-size: 36px;
            font-weight: bold;
            letter-spacing: 2px;
        }
        .brand-siraj {
            color: #ffffff;
            text-shadow: 0 0 10px #ffffff, 0 0 20px #ffffff, 0 0 40px var(--neon-border), 0 0 70px var(--neon-border);
        }
        .led-l { color: #ff3333; text-shadow: 0 0 10px #ff3333, 0 0 25px #ff3333, 0 0 50px rgba(255, 51, 51, 0.8), 0 0 80px rgba(255, 51, 51, 0.5); }
        .led-e { color: #00ff66; text-shadow: 0 0 10px #00ff66, 0 0 25px #00ff66, 0 0 50px rgba(0, 255, 102, 0.8), 0 0 80px rgba(0, 255, 102, 0.5); }
        .led-d { color: #00bfff; text-shadow: 0 0 10px #00bfff, 0 0 25px #00bfff, 0 0 50px rgba(0, 191, 255, 0.8), 0 0 80px rgba(0, 191, 255, 0.5); }

        .container { 
            padding: 15px; 
            max-width: 800px; 
            margin: auto; 
            height: calc(100dvh - 75px); 
            min-height: 550px; 
            box-sizing: border-box;
            padding-bottom: 30px; 
        }
        
        .grid { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            grid-template-rows: 0.9fr 1.1fr 1.1fr 1.1fr; 
            gap: 15px; 
            height: 100%; 
        }
        
        .grid-item { 
            background: var(--card-bg); 
            border-radius: 18px; 
            overflow: hidden; 
            box-shadow: 0 0 15px var(--neon-glow); 
            text-decoration: none; 
            color: var(--text-white); 
            display: flex; 
            transition: all 0.2s ease; 
            border: 2px solid var(--neon-border); 
            cursor: pointer; 
            position: relative; 
            height: 100%; 
            width: 100%;
        }
        
        .grid-item:active { 
            transform: scale(0.96); 
            box-shadow: 0 0 35px rgba(236, 72, 153, 0.9); 
            border-color: #ec4899;
            filter: brightness(1.2); 
        }
        
        .grid-item.full-width { 
            grid-column: span 2; 
            height: 100%; 
        }

        .grid-item img {
            width: 100%;
            height: 100%;
            object-fit: cover; 
            position: absolute; 
            top: 0;
            left: 0;
            z-index: 1; 
            border: none; 
        }

        .title { 
            position: absolute; 
            bottom: 0; 
            left: 0;
            width: 100%;
            text-align: center; 
            font-weight: bold; 
            font-size: 19px; 
            padding: 15px 0 10px 0; 
            z-index: 2; 
            color: #ffffff; 
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 1), -2px -2px 4px rgba(0, 0, 0, 1), 0 0 15px rgba(0, 0, 0, 0.9);
            background: linear-gradient(to top, rgba(0, 0, 0, 0.9) 0%, rgba(0, 0, 0, 0.4) 60%, transparent 100%);
        }
        
        .grid-item.full-width .title { 
            font-size: 24px; 
            padding: 20px 0 12px 0;
        }
    </style>
</head>
<body>

    <!-- 🌌 الشاشة الافتتاحية (تظهر أول ما تفتح وتختفي) -->
    <div id="splash-screen" style="position:fixed; top:0; left:0; width:100%; height:100%; background-color:#000; z-index:9999999; display:flex; justify-content:center; align-items:center; transition: opacity 0.5s ease;">
        <img src="icon.png" alt="سراج كاشير" style="width:100%; height:100%; object-fit:cover;">
    </div>

    <!-- ⚙️ زر الترس العائم -->
    <button onclick="openSettings()" style="position:fixed; top:20px; left:20px; background:#f59e0b; border:none; border-radius:50%; width:50px; height:50px; font-size:24px; cursor:pointer; z-index:9999; box-shadow:0 0 15px rgba(245,158,11,0.5); transition: transform 0.2s;">⚙️</button>

    <!-- 🛠️ نافذة الإعدادات المنبثقة (Modal) -->
    <div id="seraj-settings-modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:99999; justify-content:center; align-items:center; flex-direction:column; font-family:'Tajawal', sans-serif;">
        <div style="background:#1e1e1e; padding:30px; border-radius:15px; border:1px solid #f59e0b; width:90%; max-width:400px; text-align:center; box-shadow:0 0 20px rgba(245,158,11,0.2);">
            
            <h2 style="color:#f59e0b; margin-top:0; margin-bottom:20px;">إعدادات المتجر ⚙️</h2>

            <input type="text" id="set-store-name" placeholder="اسم المحل (يظهر على الفواتير)" style="width:100%; padding:12px; margin-bottom:15px; background:#333; color:#fff; border:1px solid #555; border-radius:8px; box-sizing:border-box; font-size:16px;">
            <input type="password" id="set-new-pass" placeholder="كلمة المرور الجديدة (اختياري)" style="width:100%; padding:12px; margin-bottom:15px; background:#333; color:#fff; border:1px solid #555; border-radius:8px; box-sizing:border-box; font-size:14px;">
            <input type="password" id="set-ai-key" placeholder="مفتاح الذكاء الاصطناعي (API Key)" style="width:100%; padding:12px; margin-bottom:25px; background:#333; color:#fff; border:1px solid #555; border-radius:8px; box-sizing:border-box; font-size:14px;">

            <button onclick="saveSettings()" style="width:100%; padding:15px; background:linear-gradient(45deg, #00ff66, #00cc55); color:#000; font-size:18px; font-weight:bold; border:none; border-radius:8px; cursor:pointer; margin-bottom:12px;">حفظ الإعدادات 💾</button>
            <button onclick="closeSettings()" style="width:100%; padding:15px; background:#444; color:#fff; font-size:16px; font-weight:bold; border:none; border-radius:8px; cursor:pointer;">إلغاء ❌</button>
        </div>
    </div>

    <div class="header">
        <div class="brand-container">
            <span class="brand-siraj">سراج</span>
            <span>
                <span class="led-l">L</span><span class="led-e">E</span><span class="led-d">D</span>
            </span>
        </div>
    </div>

    <div class="container">
        <div class="grid">
            <a href="store.html" class="grid-item full-width">
                <img src="store.jpg" alt="مخزن المنتجات">
                <div class="title">مخزن المنتجات</div>
            </a>
            <a href="purchases.html" class="grid-item">
                <img src="buy.jpg" alt="شراء">
                <div class="title">شراء</div>
            </a>
            <a href="sales.html" class="grid-item">
                <img src="sales.jpg" alt="بيع">
                <div class="title">بيع</div>
            </a>
            <a href="suppliers.html" class="grid-item">
                <img src="suppliers.jpg" alt="الموردين">
                <div class="title">الموردين</div>
            </a>
            <a href="customers.html" class="grid-item">
                <img src="customers.jpg" alt="العملاء">
                <div class="title">العملاء</div>
            </a>
            <a href="treasury.html" class="grid-item">
                <img src="safe.jpg" alt="الخزنة">
                <div class="title">الخزنة</div>
            </a>
            <a href="smart_accountant.html" class="grid-item">
                <img src="ai.jpg" alt="المحاسب الذكي">
                <div class="title">المحاسب الذكي</div>
            </a>
        </div>
    </div>

    <!-- 🔐 شاشة تسجيل الدخول المركزية -->
    <div id="seraj-login-screen" style="position:fixed; top:0; left:0; width:100%; height:100%; background:var(--bg-dark-1, #121212); z-index:999999; display:flex; justify-content:center; align-items:center; flex-direction:column; font-family: 'Tajawal', sans-serif;">
        <div style="background:var(--card-bg, #1e1e1e); padding:40px; border-radius:15px; border:1px solid var(--neon-border, #00ff66); box-shadow:0 0 20px var(--neon-glow, rgba(0,255,102,0.2)); text-align:center; width:90%; max-width:400px;">
            <div style="font-size: 50px; margin-bottom: 10px;">🛡️</div>
            <h2 style="color:var(--text-main, #fff); margin-bottom:5px;">سراج كاشير</h2>
            <p style="color:#aaa; font-size:14px; margin-bottom:25px;">برجاء تسجيل الدخول للوصول لبيانات متجرك</p>
            
            <input type="text" id="store-id-input" placeholder="كود المحل (ID)" style="width:100%; padding:15px; margin-bottom:15px; border-radius:8px; border:1px solid #444; background:#222; color:#fff; font-size:16px; text-align:center; box-sizing: border-box;">
            <input type="password" id="store-pass-input" placeholder="كلمة المرور" style="width:100%; padding:15px; margin-bottom:25px; border-radius:8px; border:1px solid #444; background:#222; color:#fff; font-size:16px; text-align:center; box-sizing: border-box;">
            
            <button onclick="loginToStore()" style="width:100%; padding:15px; background:linear-gradient(45deg, #00ff66, #00cc55); color:#000; border:none; border-radius:8px; font-size:18px; font-weight:bold; cursor:pointer; transition: transform 0.2s;">تسجيل الدخول 🚀</button>
            <p id="login-error" style="color:#ff4444; margin-top:15px; display:none; font-weight:bold;">بيانات الدخول غير صحيحة!</p>
        </div>
    </div>

    <!-- استدعاء ملفات السكربت -->
    <script src="db.js"></script>
    <script src="ai_brain.js?v=600"></script>
    
<script>
        // كود الشاشة الافتتاحية الذكي (يفرق بين الريفريش وزر الرجوع)
        window.addEventListener('pageshow', (event) => {
            let splash = document.getElementById('splash-screen');
            if (!splash) return;

            // التحقق القاطع: هل العميل ضغط على زر "الرجوع"؟
            let isBackBtn = event.persisted || 
                            (window.performance && window.performance.navigation && window.performance.navigation.type === 2) ||
                            (window.performance && window.performance.getEntriesByType("navigation").length > 0 && window.performance.getEntriesByType("navigation")[0].type === "back_forward");

            if (isBackBtn) {
                // لو ضغط رجوع: اخفي الشاشة الافتتاحية في جزء من الثانية بدون أنيميشن
                splash.style.display = 'none';
            } else {
                // لو بيفتح البرنامج جديد أو عمل ريفريش: شغل الأيقونة 3 ثواني
                splash.style.display = 'flex';
                setTimeout(() => {
                    splash.style.opacity = '0';
                    setTimeout(() => splash.style.display = 'none', 500);
                }, 3000);
            }
        });

        // دوال الإعدادات
        function openSettings() {
            document.getElementById('set-store-name').value = localStorage.getItem('seraj_store_name') || '';
            document.getElementById('set-ai-key').value = localStorage.getItem('seraj_ai_key') || '';
            document.getElementById('set-new-pass').value = ''; 
            document.getElementById('seraj-settings-modal').style.display = 'flex';
        }

        function closeSettings() {
            document.getElementById('seraj-settings-modal').style.display = 'none';
        }

        function saveSettings() {
            let sName = document.getElementById('set-store-name').value.trim();
            let aiKey = document.getElementById('set-ai-key').value.trim();
            let newPass = document.getElementById('set-new-pass').value.trim();
            let storeId = localStorage.getItem('seraj_store_id');

            if (sName !== "") localStorage.setItem('seraj_store_name', sName);
            if (aiKey !== "") localStorage.setItem('seraj_ai_key', aiKey);

            if (newPass !== "") {
                if (window.dbCloud && storeId) {
                    window.dbCloud.ref('Admin_Users/' + storeId).update({ password: newPass });
                    localStorage.setItem('seraj_store_pass', newPass); 
                    alert("تم تغيير كلمة المرور وحفظ الإعدادات بنجاح! 🔒");
                }
            } else {
                alert("تم حفظ الإعدادات بنجاح! ✅");
            }
            closeSettings();
        }

        // الحارس اللحظي وتسجيل الدخول
        document.addEventListener("DOMContentLoaded", () => {
            let savedStoreId = localStorage.getItem('seraj_store_id');
            if(savedStoreId) {
                document.getElementById('seraj-login-screen').style.display = 'none';
                
                setTimeout(() => {
                    if (window.dbCloud) {
                        window.dbCloud.ref('Admin_Users/' + savedStoreId + '/status').on('value', (snapshot) => {
                            if (snapshot.val() === 'suspended') {
                                localStorage.removeItem('seraj_store_id');
                                localStorage.removeItem('seraj_store_pass');
                                alert("⚠️ تم إيقاف اشتراكك! برجاء التواصل مع الإدارة.");
                                window.location.reload(); 
                            }
                        });
                    }
                }, 1000); 
            }
        });

        function loginToStore() {
            let id = document.getElementById('store-id-input').value.trim();
            let pass = document.getElementById('store-pass-input').value.trim();
            let errorMsg = document.getElementById('login-error');
            
            if(id === "" || pass === "") {
                errorMsg.innerText = "برجاء إدخال الكود وكلمة المرور!";
                errorMsg.style.display = "block";
                return;
            }

            errorMsg.innerText = "جاري التحقق... ⏳";
            errorMsg.style.display = "block";
            errorMsg.style.color = "#f59e0b";

            if (window.dbCloud) {
                window.dbCloud.ref('Admin_Users/' + id).once('value').then((snapshot) => {
                    if (snapshot.exists()) {
                        let userData = snapshot.val();
                        if (userData.status === 'suspended') {
                            errorMsg.innerText = "هذا الحساب موقوف! 🚫";
                            errorMsg.style.color = "#ff4444";
                            return;
                        }
                        if (pass === userData.password) {
                            localStorage.setItem('seraj_store_id', id);
                            localStorage.setItem('seraj_store_pass', pass);
                            document.getElementById('seraj-login-screen').style.display = 'none';
                            window.location.reload();
                        } else {
                            errorMsg.innerText = "كلمة المرور غير صحيحة ❌";
                            errorMsg.style.color = "#ff4444";
                        }
                    } else {
                        errorMsg.innerText = "كود المحل غير مسجل لدينا ❌";
                        errorMsg.style.color = "#ff4444";
                    }
                });
            }
        }
        
        // تفعيل الألوان وتطبيق الموبايل
        window.onload = () => {
            if(typeof DB !== 'undefined') DB.applySavedTheme();
        };

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch((err) => console.log(err));
        }
    </script>
</body>
</html>
