<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سراجLED - الواجهة الرئيسية</title>
    
    <!-- إضافات تطبيق الموبايل والأيقونات (الجديدة) -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#070913">
    <link rel="icon" href="icon.png" type="image/png">
    <link rel="apple-touch-icon" href="icon.png">
    
    <!-- استدعاء ملفات السحابة (Firebase) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <style>
        :root {
            --neon-border: #a855f7;
            --neon-glow: rgba(168, 85, 247, 0.5); 
            --bg-dark-1: #070913;
            --bg-dark-2: #120f29;
            --card-bg: rgba(19, 17, 44, 0.88);
            --text-white: #ffffff;        
        }

        body { 
            font-family: 'Segoe UI', Tahoma, sans-serif; 
            background: linear-gradient(135deg, var(--bg-dark-1), var(--bg-dark-2)); 
            color: var(--text-white); 
            margin: 0; 
            padding: 0; 
            user-select: none; 
            height: 100dvh; 
            width: 100vw; 
            overflow-y: auto; 
            overflow-x: hidden; 
            overscroll-behavior: none; 
            -webkit-tap-highlight-color: transparent;
        }
        
        .header { 
            background: rgba(19, 17, 44, 0.95); 
            backdrop-filter: blur(14px); 
            padding: 10px 15px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            position: sticky; 
            top: 0; 
            z-index: 50; 
            border-bottom: 3px solid var(--neon-border); 
            box-shadow: 0 0 45px var(--neon-glow), 0 10px 25px rgba(0, 0, 0, 0.7);
        }
        
        .brand-container {
            display: flex;
            align-items: center;
            gap: 14px;
            font-size: 36px;
            font-weight: bold;
            letter-spacing: 2px;
        }
        .brand-siraj {
            color: #ffffff;
            text-shadow: 0 0 10px #ffffff, 0 0 20px #ffffff, 0 0 40px var(--neon-border), 0 0 70px var(--neon-border);
        }
        .led-l { color: #ff3333; text-shadow: 0 0 10px #ff3333, 0 0 25px #ff3333, 0 0 50px rgba(255, 51, 51, 0.8), 0 0 80px rgba(255, 51, 51, 0.5); }
        .led-e { color: #00ff66; text-shadow: 0 0 10px #00ff66, 0 0 25px #00ff66, 0 0 50px rgba(0, 255, 102, 0.8), 0 0 80px rgba(0, 255, 102, 0.5); }
        .led-d { color: #00bfff; text-shadow: 0 0 10px #00bfff, 0 0 25px #00bfff, 0 0 50px rgba(0, 191, 255, 0.8), 0 0 80px rgba(0, 191, 255, 0.5); }

        .container { 
            padding: 15px; 
            max-width: 800px; 
            margin: auto; 
            height: calc(100dvh - 75px); 
            min-height: 550px; 
            box-sizing: border-box;
            padding-bottom: 30px; 
        }
        
        .grid { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            grid-template-rows: 0.9fr 1.1fr 1.1fr 1.1fr; 
            gap: 15px; 
            height: 100%; 
        }
        
        .grid-item { 
            background: var(--card-bg); 
            border-radius: 18px; 
            overflow: hidden; 
            box-shadow: 0 0 15px var(--neon-glow); 
            text-decoration: none; 
            color: var(--text-white); 
            display: flex; 
            transition: all 0.2s ease; 
            border: 2px solid var(--neon-border); 
            cursor: pointer; 
            position: relative; 
            height: 100%; 
            width: 100%;
        }
        
        .grid-item:active { 
            transform: scale(0.96); 
            box-shadow: 0 0 35px rgba(236, 72, 153, 0.9); 
            border-color: #ec4899;
            filter: brightness(1.2); 
        }
        
        .grid-item.full-width { 
            grid-column: span 2; 
            height: 100%; 
        }

        .grid-item img {
            width: 100%;
            height: 100%;
            object-fit: cover; 
            position: absolute; 
            top: 0;
            left: 0;
            z-index: 1; 
            border: none; 
        }

        .title { 
            position: absolute; 
            bottom: 0; 
            left: 0;
            width: 100%;
            text-align: center; 
            font-weight: bold; 
            font-size: 19px; 
            padding: 15px 0 10px 0; 
            z-index: 2; 
            color: #ffffff; 
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 1), -2px -2px 4px rgba(0, 0, 0, 1), 0 0 15px rgba(0, 0, 0, 0.9);
            background: linear-gradient(to top, rgba(0, 0, 0, 0.9) 0%, rgba(0, 0, 0, 0.4) 60%, transparent 100%);
        }
        
        .grid-item.full-width .title { 
            font-size: 24px; 
            padding: 20px 0 12px 0;
        }
    /* تنسيق زر القائمة ليتفاعل مع ألوان البرنامج */
        .menu-btn-themed {
            position: fixed;
            top: 20px;
            right: 20px;
            background: var(--card-bg);
            border: 2px solid var(--neon-border);
            color: var(--text-white);
            border-radius: 12px;
            width: 50px;
            height: 50px;
            font-size: 26px;
            cursor: pointer;
            z-index: 9999;
            box-shadow: 0 0 15px var(--neon-glow);
            transition: all 0.3s ease;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .menu-btn-themed:active {
            transform: scale(0.9);
            box-shadow: 0 0 25px var(--neon-border);
        }

        /* نبض ضوئي للعميل الجديد لتوجيهه للإعدادات */
        @keyframes pulse-alert {
            0% { box-shadow: 0 0 0 0 var(--neon-border); }
            70% { box-shadow: 0 0 0 15px rgba(0,0,0,0); }
            100% { box-shadow: 0 0 0 0 rgba(0,0,0,0); }
        }
        .needs-setup {
            animation: pulse-alert 2s infinite;
        }    
    </style>
</head>
<body>

    <!-- 🌌 الشاشة الافتتاحية (تظهر أول ما تفتح وتختفي) -->

        <img src="icon.png" alt="سراج كاشير" style="width:100%; height:100%; object-fit:cover;">

        <h2 style="color:var(--text-white); text-align:center; border-bottom:1px solid var(--neon-border); padding-bottom:15px; margin-top:0; text-shadow: 0 0 10px var(--neon-glow);">القائمة الرئيسية</h2>

        <input type="file" id="restore-file-input" accept=".json" style="display:none;" onchange="restoreData(event)">
        
 <button onclick="openTreasurySettings(); toggleSidebar();" style="width:100%; padding:12px; margin-bottom:10px; background:var(--card-bg); color:var(--text-white); border:1px solid var(--neon-border); border-radius:8px; font-size:16px; text-align:right; cursor:pointer; box-shadow:0 0 10px var(--neon-glow);">💰 إعدادات الخزينة</button>
        
        <button onclick="window.open('https://wa.me/201000000000', '_blank'); toggleSidebar();" style="width:100%; padding:12px; margin-bottom:10px; background:#128C7E; color:#fff; border:none; border-radius:8px; font-size:16px; text-align:right; cursor:pointer; font-weight:bold;">📞 الاتصال بالدعم الفني</button>

<!-- 🛠️ نافذة إعدادات المتجر (متوافقة مع ألوان البرنامج) -->
    <div id="seraj-settings-modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:999999; justify-content:center; align-items:center; flex-direction:column; font-family:'Tajawal', sans-serif;">
        <div style="background:var(--card-bg); padding:30px; border-radius:15px; border:2px solid var(--neon-border); box-shadow:0 0 25px var(--neon-glow); width:90%; max-width:400px; text-align:center;">

            <input type="password" id="set-ai-key" placeholder="مفتاح الذكاء الاصطناعي (API Key)" style="width:100%; padding:12px; margin-bottom:10px; background:rgba(0,0,0,0.5); color:var(--text-white); border:1px solid var(--neon-border); border-radius:8px; box-sizing:border-box; outline:none;">

    <script src="ai_brain.js?v=600"></script>
    
    <script>
        // 1. كود الشاشة الافتتاحية الذكي (يفرق بين الريفريش وزر الرجوع)
        window.addEventListener('load', () => {
            let splash = document.getElementById('splash-screen');
            if (!splash) return;

            // التحقق من الذاكرة المؤقتة: هل الشاشة ظهرت قبل كده؟
            if (sessionStorage.getItem('splash_seen_already')) {
                // لو ظهرت (يعني بتعمل ريفريش أو باك)، اخفيها فوراً بدون أنيميشن
                splash.style.display = 'none';
            } else {
                // لو دي أول فتحة للبرنامج، اعرضها 3 ثواني واختم الذاكرة
                splash.style.display = 'flex';
                setTimeout(() => {
                    splash.style.opacity = '0';
                    setTimeout(() => {
                        splash.style.display = 'none';
                        sessionStorage.setItem('splash_seen_already', 'true'); // وضع الختم
                    }, 500);
                }, 3000);
            }
        });

// دوال القائمة الجانبية
        function toggleSidebar() {
            let sidebar = document.getElementById('main-sidebar');
            let overlay = document.getElementById('sidebar-overlay');
            if (sidebar.style.right === '0px') {
                sidebar.style.right = '-300px';
                overlay.style.display = 'none';
            } else {
                sidebar.style.right = '0px';
                overlay.style.display = 'block';
            }
        }
// دالة حفظ نسخة من البيانات (Backup)
        function backupData() {
            let dataObj = {};
            // سحب كل البيانات المحفوظة في ذاكرة المتصفح
            for (let i = 0; i < localStorage.length; i++) {
                let key = localStorage.key(i);
                dataObj[key] = localStorage.getItem(key);
            }

            function changeSecurityPin() {
    let settings = JSON.parse(localStorage.getItem('seraj_treasury_settings')) || { pin: '1234' };
    
    let oldPin = prompt("🔒 الأمان: برجاء إدخال الرقم السري الحالي أولاً:");
    if (oldPin === null) return; 
    
    if (oldPin !== settings.pin) {
        alert("❌ الرقم السري الحالي غير صحيح! لا يمكنك التعديل.");
        return; 
    }
    
    let newPin = prompt("✅ ممتاز! أدخل الرقم السري الجديد:");
    if (newPin && newPin.trim() !== "") {
        settings.pin = newPin.trim();
        localStorage.setItem('seraj_treasury_settings', JSON.stringify(settings));
        alert("تم تغيير الرقم السري بنجاح! 🔐");
    }
}
            
           // دالة استرجاع البيانات من الملف
        function restoreData(event) {
            let file = event.target.files[0]; // سحب الملف اللي العميل اختاره
            if (!file) return;

            let reader = new FileReader();
            reader.onload = function(e) {
                try {
                    // قراءة الملف وتحويله لبيانات يفهمها البرنامج
                    let dataObj = JSON.parse(e.target.result);
                    
                    // زرع البيانات في ذاكرة التليفون الجديد
                    for (let key in dataObj) {
                        localStorage.setItem(key, dataObj[key]);
                    }
                    
                    alert("تم استرجاع البيانات بنجاح! 🎊\nسيتم إعادة تحميل البرنامج لتطبيق إعداداتك الجديدة.");
                    window.location.reload(); // ريفريش أوتوماتيك لتشغيل الألوان والإعدادات
                } catch (error) {
                    alert("❌ عذراً، حدث خطأ! تأكد من أنك قمت باختيار ملف النسخة الاحتياطية الصحيح (الذي ينتهي بـ .json)");
                }
            };
            
            // قراءة الملف كنص
            reader.readAsText(file);
        } 
            // تحويل البيانات لملف قابل للتحميل
            let dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(dataObj, null, 2));
            let downloadAnchorNode = document.createElement('a');
            downloadAnchorNode.setAttribute("href", dataStr);
            
            // تسمية الملف بتاريخ اليوم (مثال: Seraj_Backup_2026-09-05.json)
            downloadAnchorNode.setAttribute("download", "Seraj_Backup_" + new Date().toISOString().slice(0,10) + ".json");
            
            document.body.appendChild(downloadAnchorNode); 
            downloadAnchorNode.click();
            downloadAnchorNode.remove();
            
            alert("تم تحميل نسخة من الإعدادات والبيانات على جهازك بنجاح! 💾");
        }
        // دوال إعدادات الطابعة
        function openPrinterSettings() {
            document.getElementById('printer-type').value = localStorage.getItem('seraj_printer_type') || 'usb';
            document.getElementById('invoice-footer-text').value = localStorage.getItem('seraj_invoice_footer') || '';
            document.getElementById('printer-settings-modal').style.display = 'flex';
        }
      // دوال إعدادات الخزينة
        function openTreasurySettings() {
            // سحب الإعدادات المحفوظة، ولو مفيش بيعتبره شغال تلقائي (auto)
            document.getElementById('set-treasury-purchases').value = localStorage.getItem('seraj_ts_purchases') || 'auto';
            document.getElementById('set-treasury-sales').value = localStorage.getItem('seraj_ts_sales') || 'auto';
            document.getElementById('set-treasury-expenses').value = localStorage.getItem('seraj_ts_expenses') || 'auto';
            
            document.getElementById('treasury-settings-modal').style.display = 'flex';
        }

        function closeTreasurySettings() {
            document.getElementById('treasury-settings-modal').style.display = 'none';
        }

        function saveTreasurySettings() {
            let pVal = document.getElementById('set-treasury-purchases').value;
            let sVal = document.getElementById('set-treasury-sales').value;
            let eVal = document.getElementById('set-treasury-expenses').value;
            
            // حفظ اختيارات العميل في ذاكرة المتصفح
            localStorage.setItem('seraj_ts_purchases', pVal);
            localStorage.setItem('seraj_ts_sales', sVal);
            localStorage.setItem('seraj_ts_expenses', eVal);
            
            alert("تم حفظ إعدادات الخزينة بنجاح! ✅\nسيتم تطبيق هذه القواعد على كل عمليات البيع والشراء والمصروفات القادمة.");
            closeTreasurySettings();
        }  
// دوال إعدادات المتجر (التي تم مسحها بالغلط)
        function openSettings() {
            document.getElementById('set-store-name').value = localStorage.getItem('seraj_store_name') || '';
            document.getElementById('set-ai-key').value = localStorage.getItem('seraj_ai_key') || '';
            document.getElementById('set-new-pass').value = ''; 
            document.getElementById('seraj-settings-modal').style.display = 'flex';
        }

        function closeSettings() {
            document.getElementById('seraj-settings-modal').style.display = 'none';
        }

        function saveSettings() {
            let sName = document.getElementById('set-store-name').value.trim();
            let aiKey = document.getElementById('set-ai-key').value.trim();
            let newPass = document.getElementById('set-new-pass').value.trim();
            let storeId = localStorage.getItem('seraj_store_id');

            if (sName !== "") localStorage.setItem('seraj_store_name', sName);
            if (aiKey !== "") localStorage.setItem('seraj_ai_key', aiKey);

            if (newPass !== "") {
                if (window.dbCloud && storeId) {
                    window.dbCloud.ref('Admin_Users/' + storeId).update({ password: newPass });
                    localStorage.setItem('seraj_store_pass', newPass); 
                    alert("تم تغيير كلمة المرور وحفظ الإعدادات بنجاح! 🔒");
                }
            } else {
                alert("تم حفظ الإعدادات بنجاح! ✅");
            }
            
            // إيقاف النبض الضوئي لزر القائمة بعد التسجيل
            let menuBtn = document.getElementById('main-menu-btn');
            if (menuBtn) menuBtn.classList.remove('needs-setup');

            closeSettings();
        }
        function closePrinterSettings() {
            document.getElementById('printer-settings-modal').style.display = 'none';
        }

        function savePrinterSettings() {
            let pType = document.getElementById('printer-type').value;
            let pText = document.getElementById('invoice-footer-text').value.trim();
            
            localStorage.setItem('seraj_printer_type', pType);
            localStorage.setItem('seraj_invoice_footer', pText);
            
            alert("تم حفظ إعدادات الطابعة بنجاح! ✅");
            closePrinterSettings();
        }

        function closeSettings() {
            document.getElementById('seraj-settings-modal').style.display = 'none';
        }

        function saveSettings() {
            let sName = document.getElementById('set-store-name').value.trim();
            let aiKey = document.getElementById('set-ai-key').value.trim();
            let newPass = document.getElementById('set-new-pass').value.trim();
            let storeId = localStorage.getItem('seraj_store_id');

            if (sName !== "") localStorage.setItem('seraj_store_name', sName);
            if (aiKey !== "") localStorage.setItem('seraj_ai_key', aiKey);

            if (newPass !== "") {
                if (window.dbCloud && storeId) {
                    window.dbCloud.ref('Admin_Users/' + storeId).update({ password: newPass });
                    localStorage.setItem('seraj_store_pass', newPass); 
                    alert("تم تغيير كلمة المرور وحفظ الإعدادات بنجاح! 🔒");
                }
            } else {
                alert("تم حفظ الإعدادات بنجاح! ✅");
            }
         document.getElementById('main-menu-btn').classList.remove('needs-setup');   
            closeSettings();
        }

        // 3. الحارس اللحظي وتسجيل الدخول
        document.addEventListener("DOMContentLoaded", () => {
            let savedStoreId = localStorage.getItem('seraj_store_id');
            if(savedStoreId) {
                document.getElementById('seraj-login-screen').style.display = 'none';
                
                setTimeout(() => {
                    if (window.dbCloud) {
                        window.dbCloud.ref('Admin_Users/' + savedStoreId + '/status').on('value', (snapshot) => {
                            if (snapshot.val() === 'suspended') {
                                localStorage.removeItem('seraj_store_id');
                                localStorage.removeItem('seraj_store_pass');
                                alert("⚠️ تم إيقاف اشتراكك! برجاء التواصل مع الإدارة.");
                                window.location.reload(); 
                            }
                        });
                    }
                }, 1000); 
            }
         // توجيه العميل الجديد لإعدادات المتجر
            if (!localStorage.getItem('seraj_store_name')) {
                let menuBtn = document.getElementById('main-menu-btn');
                if (menuBtn) menuBtn.classList.add('needs-setup');
                
                // رسالة تظهر بعد الشاشة الافتتاحية بـ 3.5 ثانية
                setTimeout(() => {
                    alert("مرحباً بك في سراج كاشير! 🌟\nبرجاء الضغط على زر القائمة (☰) أعلى الشاشة للدخول إلى 'إعدادات المتجر' وضبط اسم محلك ومفتاح الذكاء الاصطناعي.");
                }, 3500);
            }   
        });

        function loginToStore() {
            let id = document.getElementById('store-id-input').value.trim();
            let pass = document.getElementById('store-pass-input').value.trim();
            let errorMsg = document.getElementById('login-error');
            
            if(id === "" || pass === "") {
                errorMsg.innerText = "برجاء إدخال الكود وكلمة المرور!";
                errorMsg.style.display = "block";
                return;
            }

            errorMsg.innerText = "جاري التحقق... ⏳";
            errorMsg.style.display = "block";
            errorMsg.style.color = "#f59e0b";

            if (window.dbCloud) {
                window.dbCloud.ref('Admin_Users/' + id).once('value').then((snapshot) => {
                    if (snapshot.exists()) {
                        let userData = snapshot.val();
                        if (userData.status === 'suspended') {
                            errorMsg.innerText = "هذا الحساب موقوف! 🚫";
                            errorMsg.style.color = "#ff4444";
                            return;
                        }
                        if (pass === userData.password) {
                            localStorage.setItem('seraj_store_id', id);
                            localStorage.setItem('seraj_store_pass', pass);
                            document.getElementById('seraj-login-screen').style.display = 'none';
                            window.location.reload();
                        } else {
                            errorMsg.innerText = "كلمة المرور غير صحيحة ❌";
                            errorMsg.style.color = "#ff4444";
                        }
                    } else {
                        errorMsg.innerText = "كود المحل غير مسجل لدينا ❌";
                        errorMsg.style.color = "#ff4444";
                    }
                });
            }
        }
        
        // 4. تفعيل الألوان
        window.onload = () => {
            if(typeof DB !== 'undefined') DB.applySavedTheme();
        };
    </script>
</body>
</html>
