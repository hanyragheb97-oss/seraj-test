<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سراج - لوحة تحكم الإدارة</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        body { background-color: #121212; color: #fff; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .admin-box { background: #1e1e1e; padding: 40px; border-radius: 10px; border: 2px solid #f59e0b; text-align: center; width: 300px; box-shadow: 0 0 15px rgba(245, 158, 11, 0.2); }
        input { width: 90%; padding: 10px; margin: 10px 0; border-radius: 5px; border: 1px solid #555; background: #333; color: white; text-align: center; }
        button { width: 95%; padding: 10px; background: #f59e0b; color: black; font-weight: bold; border: none; border-radius: 5px; cursor: pointer; margin-top: 15px; }
        #status-msg { margin-top: 15px; font-weight: bold; height: 20px; }
    </style>
</head>
<body>

    <div class="admin-box">
        <h2 style="color: #f59e0b;">🛡️ لوحة التحكم السرية</h2>
        <p style="font-size: 14px; color: #aaa;">إضافة محل جديد لقاعدة البيانات</p>
        
        <input type="text" id="new-store-id" placeholder="كود المحل (ID)">
        <input type="text" id="new-store-pass" placeholder="كلمة المرور">
        
        <button onclick="createNewStore()">إضافة المحل الآن</button>
        <div id="status-msg"></div>
    </div>

    <script>
        // إعدادات قاعدة بياناتك (serajled)
        const firebaseConfig = {
            databaseURL: "https://serajled-default-rtdb.firebaseio.com",
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        function createNewStore() {
            let storeId = document.getElementById('new-store-id').value.trim();
            let storePass = document.getElementById('new-store-pass').value.trim();
            let msg = document.getElementById('status-msg');

            if(storeId === "" || storePass === "") {
                msg.innerText = "برجاء إدخال الكود والباسورد!";
                msg.style.color = "#ff4444";
                return;
            }

            msg.innerText = "جاري الإضافة... ⏳";
            msg.style.color = "#f59e0b";

            // إضافة العميل لفايربيز
            db.ref('Admin_Users/' + storeId).set({
                password: storePass
            }).then(() => {
                msg.innerText = "✅ تم تسجيل المحل بنجاح!";
                msg.style.color = "#00ff66";
                document.getElementById('new-store-id').value = "";
                document.getElementById('new-store-pass').value = "";
            }).catch((error) => {
                msg.innerText = "❌ حدث خطأ في الاتصال!";
                msg.style.color = "#ff4444";
            });
        }
    </script>
</body>
</html>
